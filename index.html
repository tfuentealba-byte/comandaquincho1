<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos — Quincho Tolpán Renaico</title>
    <style>
        :root {
            --marron: #6b3e26;
            --crema: #faf6ef;
            --crema-oscura: #f0e8dc;
            --marron-10: rgba(107, 62, 38, 0.10);
            --marron-20: rgba(107, 62, 38, 0.20);
            --marron-30: rgba(107, 62, 38, 0.30);
            --marron-60: rgba(107, 62, 38, 0.60);
            --verde: #25D366;
            --rojo: #c0392b;
            --sombra: 0 2px 8px rgba(107, 62, 38, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--crema);
            color: var(--marron);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
            min-height: 100vh;
        }

        .contenedor {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 24px;
            align-items: start;
        }

        /* --- Encabezado --- */
        .header {
            grid-column: 1 / -1;
            background: var(--marron);
            color: var(--crema);
            padding: 18px 24px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--sombra);
        }

        .header h1 {
            font-size: 1.5em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header .info-mesa {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--crema);
            padding: 8px 16px;
            border-radius: 30px;
            color: var(--marron);
        }

        .header .info-mesa label {
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header .info-mesa input {
            border: 2px solid var(--marron-30);
            border-radius: 8px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 1em;
            width: 90px;
            text-align: center;
            color: var(--marron);
            background: white;
        }

        .header .info-mesa input:focus {
            outline: none;
            border-color: var(--marron);
        }

        /* --- Menú de productos --- */
        .menu-panel {
            background: var(--crema);
            border-radius: 14px;
            box-shadow: var(--sombra);
            border: 2px solid var(--marron-20);
            overflow: hidden;
        }

        .menu-header {
            background: var(--marron);
            color: var(--crema);
            padding: 14px 20px;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .categorias-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 16px;
            background: var(--crema-oscura);
            border-bottom: 2px solid var(--marron-20);
            scrollbar-width: thin;
        }

        .categorias-nav::-webkit-scrollbar { height: 5px; }
        .categorias-nav::-webkit-scrollbar-thumb { background: var(--marron-60); border-radius: 3px; }

        .cat-btn {
            flex-shrink: 0;
            background: transparent;
            border: 2px solid transparent;
            color: var(--marron);
            font-family: inherit;
            font-size: 0.88em;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .cat-btn:hover { background: var(--marron-10); }
        .cat-btn.activo {
            background: var(--marron);
            color: var(--crema);
            border-color: var(--marron);
        }

        .productos-lista {
            padding: 16px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .producto-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid var(--marron-10);
            gap: 12px;
            transition: background 0.15s;
        }

        .producto-item:hover { background: var(--marron-10); }
        .producto-item:last-child { border-bottom: none; }

        .producto-item .prod-info { flex: 1; }

        .producto-item .prod-nombre {
            font-weight: bold;
            font-size: 1.02em;
            display: block;
        }

        .producto-item .prod-desc {
            font-size: 0.85em;
            font-style: italic;
            opacity: 0.8;
            display: block;
            margin-top: 2px;
        }

        .producto-item .prod-precio {
            font-weight: bold;
            font-size: 1.05em;
            white-space: nowrap;
            margin-right: 8px;
        }

        .btn-agregar {
            background: var(--marron);
            color: var(--crema);
            border: 2px solid var(--marron);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.4em;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: inherit;
        }

        .btn-agregar:hover {
            background: var(--crema);
            color: var(--marron);
            transform: scale(1.1);
        }

        /* --- Panel de orden --- */
        .orden-panel {
            background: var(--crema);
            border-radius: 14px;
            box-shadow: var(--sombra);
            border: 2px solid var(--marron-20);
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 40px);
        }

        .orden-header {
            background: var(--marron);
            color: var(--crema);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .orden-header h2 {
            font-size: 1.1em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .orden-header .contador {
            background: var(--crema);
            color: var(--marron);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .orden-items {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            min-height: 150px;
        }

        .orden-vacio {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.6;
            font-style: italic;
        }

        .orden-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px dashed var(--marron-20);
        }

        .orden-item .item-nombre {
            flex: 1;
            font-size: 0.92em;
            font-weight: bold;
            line-height: 1.3;
        }

        .orden-item .item-precio {
            font-size: 0.88em;
            opacity: 0.8;
            white-space: nowrap;
        }

        .cantidad-control {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-cant {
            background: var(--marron-10);
            border: 1px solid var(--marron-30);
            color: var(--marron);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-family: inherit;
        }

        .btn-cant:hover {
            background: var(--marron);
            color: var(--crema);
        }

        .cantidad-num {
            min-width: 24px;
            text-align: center;
            font-weight: bold;
            font-size: 0.95em;
        }

        .btn-eliminar {
            background: transparent;
            border: none;
            color: var(--rojo);
            cursor: pointer;
            font-size: 1.1em;
            padding: 4px;
            opacity: 0.6;
            transition: opacity 0.15s;
        }

        .btn-eliminar:hover { opacity: 1; }

        .orden-footer {
            border-top: 3px double var(--marron);
            padding: 16px 20px;
            background: var(--crema-oscura);
            border-radius: 0 0 14px 14px;
        }

        .total-linea {
            display: flex;
            justify-content: space-between;
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .acciones {
            display: flex;
            gap: 8px;
        }

        .btn-accion {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--marron);
            font-family: inherit;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primario {
            background: var(--marron);
            color: var(--crema);
        }

        .btn-primario:hover {
            background: var(--crema);
            color: var(--marron);
        }

        .btn-secundario {
            background: transparent;
            color: var(--marron);
        }

        .btn-secundario:hover {
            background: var(--marron);
            color: var(--crema);
        }

        /* --- Modal orden generada --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.visible { display: flex; }

        .modal-orden {
            background: white;
            border-radius: 14px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 3px solid var(--marron);
        }

        .modal-orden-header {
            background: var(--marron);
            color: var(--crema);
            padding: 18px 24px;
            text-align: center;
        }

        .modal-orden-header h2 {
            font-size: 1.3em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .modal-orden-header .fecha {
            font-size: 0.85em;
            opacity: 0.9;
            margin-top: 4px;
        }

        .modal-orden-body {
            padding: 24px;
            font-family: 'Courier New', monospace;
            color: #333;
        }

        .orden-ticket {
            border-bottom: 2px dashed #333;
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .ticket-linea {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.92em;
        }

        .ticket-linea.total {
            font-weight: bold;
            font-size: 1.2em;
            border-top: 2px solid #333;
            padding-top: 10px;
            margin-top: 10px;
        }

        .modal-orden-footer {
            padding: 16px 24px 24px;
            display: flex;
            gap: 10px;
        }

        .modal-orden-footer button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--marron);
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }

        .btn-imprimir {
            background: var(--marron);
            color: var(--crema);
        }

        .btn-imprimir:hover { background: var(--crema); color: var(--marron); }

        .btn-cerrar {
            background: transparent;
            color: var(--marron);
        }

        .btn-cerrar:hover { background: var(--marron); color: var(--crema); }

        /* --- Responsive --- */
        @media (max-width: 1000px) {
            .contenedor {
                grid-template-columns: 1fr;
            }

            .orden-panel {
                position: static;
                max-height: none;
            }

            .productos-lista {
                max-height: 50vh;
            }
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header { padding: 14px 16px; }
            .header h1 { font-size: 1.1em; }
            .header .info-mesa { width: 100%; justify-content: center; }
            .producto-item { flex-wrap: wrap; }
            .producto-item .prod-info { width: 100%; }
        }

        /* --- Impresión --- */
        @media print {
            body * { visibility: hidden; }
            .modal-overlay.visible,
            .modal-overlay.visible * { visibility: visible; }
            .modal-overlay.visible {
                position: absolute;
                inset: 0;
                background: white;
                display: block !important;
                padding: 0;
            }
            .modal-orden {
                box-shadow: none;
                border: none;
                max-width: 100%;
                max-height: none;
            }
            .modal-orden-footer,
            .modal-orden-header .fecha { display: none; }
            .modal-orden-header { background: white; color: black; border-bottom: 2px solid black; }
            .modal-orden-header h2 { color: black; }
        }
    </style>
</head>
<body>

<div class="contenedor">

    <!-- Encabezado -->
    <header class="header">
        <h1>🍽️ Quincho Tolpán Renaico — Pedidos</h1>
        <div class="info-mesa">
            <label for="mesa">Mesa / Cliente:</label>
            <input type="text" id="mesa" placeholder="N°" maxlength="10">
        </div>
    </header>

    <!-- Panel del menú -->
    <section class="menu-panel">
        <div class="menu-header">Menú</div>
        <div class="categorias-nav" id="categoriasNav"></div>
        <div class="productos-lista" id="productosLista"></div>
    </section>

    <!-- Panel de la orden -->
    <aside class="orden-panel">
        <div class="orden-header">
            <h2>Orden actual</h2>
            <span class="contador" id="contadorItems">0</span>
        </div>
        <div class="orden-items" id="ordenItems">
            <div class="orden-vacio">No hay productos en la orden.<br>Agrega platos desde el menú.</div>
        </div>
        <div class="orden-footer">
            <div class="total-linea">
                <span>Total:</span>
                <span id="totalOrden">$0</span>
            </div>
            <div class="acciones">
                <button class="btn-accion btn-secundario" id="btnLimpiar">Limpiar</button>
                <button class="btn-accion btn-primario" id="btnGenerar">Generar Orden</button>
            </div>
        </div>
    </aside>

</div>

<!-- Modal de orden generada -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-orden">
        <div class="modal-orden-header">
            <h2>Quincho Tolpán Renaico</h2>
            <div class="fecha" id="fechaOrden"></div>
        </div>
        <div class="modal-orden-body">
            <div class="orden-ticket" id="ticketContenido"></div>
            <div class="ticket-linea total">
                <span>TOTAL</span>
                <span id="ticketTotal">$0</span>
            </div>
        </div>
        <div class="modal-orden-footer">
            <button class="btn-cerrar" id="btnCerrarModal">Cerrar</button>
            <button class="btn-imprimir" id="btnImprimir">🖨️ Imprimir</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // DATOS DEL MENÚ (extraídos de la carta)
    // ============================================================
    const menuData = {
        "Menú del día": [
            { nombre: "Menú del día", desc: "Incluye limonada, sopaipillas, pan amasado, chancho en piedra, consomé o ensalada, guarnición, plato de fondo, postre y bajativo", precio: 15500 },
            { nombre: "Menú de niño", desc: "Misma estructura del menú del día, porción infantil", precio: 7500 }
        ],
        "Platos de fondo": [
            { nombre: "Salmón", desc: "Incluye entrada, guarnición, postre y bajativo", precio: 18500 },
            { nombre: "Salmón salsa de camarón", desc: "Incluye entrada, guarnición, postre y bajativo", precio: 23500 },
            { nombre: "Plateada", desc: "Incluye entrada, guarnición, postre y bajativo", precio: 22500 },
            { nombre: "Plateada a lo pobre", desc: "Incluye entrada, guarnición, postre y bajativo", precio: 25500 },
            { nombre: "Lomo vetado", desc: "Incluye entrada, guarnición, postre y bajativo", precio: 23500 },
            { nombre: "Lomo corralero", desc: "Agregado a lo pobre · Incluye entrada, guarnición, postre y bajativo", precio: 23500 },
            { nombre: "Lomo saltado", desc: "Incluye entrada, guarnición, postre y bajativo", precio: 18500 },
            { nombre: "Pechuga de pollo", desc: "Incluye entrada, guarnición, postre y bajativo", precio: 16500 },
            { nombre: "Pechuga Corralera", desc: "Incluye entrada, guarnición, postre y bajativo", precio: 22500 }
        ],
        "Pastas": [
            { nombre: "Pastas", desc: "Fettuccine, ñoquis, ravioli o lasaña · Incluye entrada, guarnición, postre y bajativo", precio: 16500 },
            { nombre: "Pastas con camarón", desc: "Incluye entrada, guarnición, postre y bajativo", precio: 18500 }
        ],
        "Para compartir": [
            { nombre: "Tabla de la casa", desc: "Ideal para compartir", precio: 23500 },
            { nombre: "Tabla quesos y prosciutto", desc: "Papas fritas, camarones, queso, prosciutto, tomate cherry y tostadas", precio: 23500 },
            { nombre: "Empanadas x 6", desc: "Media docena", precio: 5000 },
            { nombre: "Empanadas x 12", desc: "Docena completa", precio: 10000 }
        ],
        "Extras": [
            { nombre: "Palmito", precio: 3900 },
            { nombre: "Ensalada individual", precio: 3500 },
            { nombre: "Papa frita grande", precio: 7000 },
            { nombre: "Papa frita chica", precio: 4500 },
            { nombre: "Café helado", precio: 5500 },
            { nombre: "Papaya", precio: 4500 },
            { nombre: "Copa de helado", precio: 3500 }
        ],
        "Bebestibles": [
            { nombre: "Bebida Coca-Cola", precio: 2000 },
            { nombre: "Red Bull", precio: 3000 },
            { nombre: "Bebida CCU", precio: 1000 },
            { nombre: "Agua", precio: 2000 },
            { nombre: "Jugo natural", precio: 3500 }
        ],
        "Vinos": [
            { nombre: "Misiones 187 cc", precio: 3500 },
            { nombre: "Castillo Molina 375 cc", precio: 8000 },
            { nombre: "Oveja", precio: 15000 },
            { nombre: "Aliwen", precio: 15000 },
            { nombre: "Castillo Molina", precio: 15000 }
        ],
        "Tragos": [
            { nombre: "Pisco sour", precio: 3500 },
            { nombre: "Ramazzotti", desc: "Incluye botellín de espumante de 187 cc", precio: 8000 },
            { nombre: "Aperol", desc: "Incluye botellín de espumante de 187 cc", precio: 8000 },
            { nombre: "Gin, Fentimans y tónica", precio: 8500 },
            { nombre: "Whisky Chivas", precio: 7000 },
            { nombre: "Tequila margarita", precio: 5500 },
            { nombre: "Sangría", precio: 5000 },
            { nombre: "Piscola", precio: 4000 }
        ],
        "Cervezas": [
            { nombre: "Kunstmann", desc: "Nacional", precio: 4000 },
            { nombre: "Dolbek", desc: "Importada", precio: 4000 },
            { nombre: "Royal", desc: "Nacional", precio: 3000 },
            { nombre: "Heineken", desc: "Nacional", precio: 3000 },
            { nombre: "Corona", desc: "Importada", precio: 3000 },
            { nombre: "Erdinger", desc: "Importada", precio: 4500 },
            { nombre: "Peroni", desc: "Importada", precio: 4500 }
        ],
        "Café": [
            { nombre: "Espresso", precio: 3000 },
            { nombre: "Café sabor", precio: 4500 }
        ]
    };

    // ============================================================
    // ESTADO DE LA APLICACIÓN
    // ============================================================
    let orden = []; // Array de { nombre, precio, cantidad }
    let categoriaActual = Object.keys(menuData)[0];

    // Elementos del DOM
    const categoriasNav = document.getElementById('categoriasNav');
    const productosLista = document.getElementById('productosLista');
    const ordenItems = document.getElementById('ordenItems');
    const contadorItems = document.getElementById('contadorItems');
    const totalOrden = document.getElementById('totalOrden');
    const mesaInput = document.getElementById('mesa');
    const modalOverlay = document.getElementById('modalOverlay');
    const ticketContenido = document.getElementById('ticketContenido');
    const ticketTotal = document.getElementById('ticketTotal');
    const fechaOrden = document.getElementById('fechaOrden');

    // ============================================================
    // UTILIDADES
    // ============================================================
    const formatoPrecio = (n) => '$' + n.toLocaleString('es-CL');

    const guardarEstado = () => {
        localStorage.setItem('ordenTolpan', JSON.stringify(orden));
        localStorage.setItem('mesaTolpan', mesaInput.value);
    };

    const cargarEstado = () => {
        const guardado = localStorage.getItem('ordenTolpan');
        const mesaGuardada = localStorage.getItem('mesaTolpan');
        if (guardado) {
            try { orden = JSON.parse(guardado); } catch(e) { orden = []; }
        }
        if (mesaGuardada) mesaInput.value = mesaGuardada;
    };

    // ============================================================
    // RENDERIZADO DEL MENÚ
    // ============================================================
    const renderCategorias = () => {
        categoriasNav.innerHTML = '';
        Object.keys(menuData).forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn' + (cat === categoriaActual ? ' activo' : '');
            btn.textContent = cat;
            btn.addEventListener('click', () => {
                categoriaActual = cat;
                renderCategorias();
                renderProductos();
            });
            categoriasNav.appendChild(btn);
        });
    };

    const renderProductos = () => {
        productosLista.innerHTML = '';
        const productos = menuData[categoriaActual] || [];
        productos.forEach(prod => {
            const div = document.createElement('div');
            div.className = 'producto-item';
            div.innerHTML = `
                <div class="prod-info">
                    <span class="prod-nombre">${prod.nombre}</span>
                    ${prod.desc ? `<span class="prod-desc">${prod.desc}</span>` : ''}
                </div>
                <span class="prod-precio">${formatoPrecio(prod.precio)}</span>
                <button class="btn-agregar" title="Agregar a la orden">+</button>
            `;
            div.querySelector('.btn-agregar').addEventListener('click', () => agregarProducto(prod));
            productosLista.appendChild(div);
        });
    };

    // ============================================================
    // LÓGICA DE LA ORDEN
    // ============================================================
    const agregarProducto = (prod) => {
        const existente = orden.find(item => item.nombre === prod.nombre && item.precio === prod.precio);
        if (existente) {
            existente.cantidad++;
        } else {
            orden.push({ nombre: prod.nombre, precio: prod.precio, cantidad: 1 });
        }
        renderOrden();
        guardarEstado();
    };

    const cambiarCantidad = (index, delta) => {
        const item = orden[index];
        if (!item) return;
        item.cantidad += delta;
        if (item.cantidad <= 0) {
            orden.splice(index, 1);
        }
        renderOrden();
        guardarEstado();
    };

    const eliminarItem = (index) => {
        orden.splice(index, 1);
        renderOrden();
        guardarEstado();
    };

    const limpiarOrden = () => {
        if (orden.length === 0) return;
        if (confirm('¿Estás seguro de que quieres limpiar toda la orden?')) {
            orden = [];
            renderOrden();
            guardarEstado();
        }
    };

    const renderOrden = () => {
        // Contador
        const totalItems = orden.reduce((sum, item) => sum + item.cantidad, 0);
        contadorItems.textContent = totalItems;

        // Items
        if (orden.length === 0) {
            ordenItems.innerHTML = '<div class="orden-vacio">No hay productos en la orden.<br>Agrega platos desde el menú.</div>';
        } else {
            ordenItems.innerHTML = '';
            orden.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'orden-item';
                div.innerHTML = `
                    <div class="item-nombre">${item.nombre}</div>
                    <div class="cantidad-control">
                        <button class="btn-cant" data-action="menos">−</button>
                        <span class="cantidad-num">${item.cantidad}</span>
                        <button class="btn-cant" data-action="mas">+</button>
                    </div>
                    <span class="item-precio">${formatoPrecio(item.precio * item.cantidad)}</span>
                    <button class="btn-eliminar" title="Eliminar">✕</button>
                `;

                div.querySelector('[data-action="menos"]').addEventListener('click', () => cambiarCantidad(index, -1));
                div.querySelector('[data-action="mas"]').addEventListener('click', () => cambiarCantidad(index, 1));
                div.querySelector('.btn-eliminar').addEventListener('click', () => eliminarItem(index));

                ordenItems.appendChild(div);
            });
        }

        // Total
        const total = orden.reduce((sum, item) => sum + item.precio * item.cantidad, 0);
        totalOrden.textContent = formatoPrecio(total);
    };

    // ============================================================
    // GENERAR ORDEN / TICKET
    // ============================================================
    const generarOrden = () => {
        if (orden.length === 0) {
            alert('La orden está vacía. Agrega productos antes de generar la orden.');
            return;
        }

        const mesa = mesaInput.value.trim() || 'Sin asignar';
        const ahora = new Date();
        const fechaStr = ahora.toLocaleDateString('es-CL', { 
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });

        // Construir ticket
        let ticketHTML = `
            <div class="ticket-linea">
                <span><strong>Mesa / Cliente:</strong></span>
                <span>${mesa}</span>
            </div>
            <div class="ticket-linea">
                <span><strong>Fecha:</strong></span>
                <span>${fechaStr}</span>
            </div>
            <div style="border-top: 1px dashed #333; margin: 10px 0;"></div>
        `;

        orden.forEach(item => {
            ticketHTML += `
                <div class="ticket-linea">
                    <span>${item.cantidad} x ${item.nombre}</span>
                    <span>${formatoPrecio(item.precio * item.cantidad)}</span>
                </div>
            `;
        });

        ticketContenido.innerHTML = ticketHTML;
        const total = orden.reduce((sum, item) => sum + item.precio * item.cantidad, 0);
        ticketTotal.textContent = formatoPrecio(total);
        fechaOrden.textContent = `Generado el ${fechaStr}`;

        modalOverlay.classList.add('visible');
    };

    // ============================================================
    // EVENTOS
    // ============================================================
    document.getElementById('btnGenerar').addEventListener('click', generarOrden);
    document.getElementById('btnLimpiar').addEventListener('click', limpiarOrden);

    document.getElementById('btnCerrarModal').addEventListener('click', () => {
        modalOverlay.classList.remove('visible');
    });

    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
            modalOverlay.classList.remove('visible');
        }
    });

    document.getElementById('btnImprimir').addEventListener('click', () => {
        window.print();
    });

    mesaInput.addEventListener('input', guardarEstado);

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    const init = () => {
        cargarEstado();
        renderCategorias();
        renderProductos();
        renderOrden();
    };

    init();
</script>

</body>
</html>
